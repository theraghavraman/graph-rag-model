[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-graph-rag"
version = "0.2.0"
description = "Graph-based retrieval over a data catalog: exact multi-hop lineage answers, compared against vector retrieval."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["duckdb>=1.0", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
catalog-graph = "catalog_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
